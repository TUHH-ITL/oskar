# Real-time pruning stack, Isaac Sim two-by-two orchard.
# Geometry values come from the scene via oskar_simulation/scripts/export_*.py;
# they are scene facts, not tuned numbers, and are regenerated, not edited.

detection_3d_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /wrist_cam/left/image_raw
    depth_topic: /wrist_cam/left/depth
    camera_info_topic: /wrist_cam/left/camera_info
    optical_frame: wrist_cam_left
    map_frame: map
    # A model file of oskar_detection, the same files the offline perception
    # loads; a new object class is a new model file. "oracle" takes masks from
    # the simulator's instance segmentation instead, so geometry and timing can
    # be brought up without the detector in the loop.
    #
    # Cost on this machine, 1280x720: MaskDINO 331 ms a frame, Mask2Former
    # 172 ms, Mask R-CNN 53 ms, the renderer's own masks 15 ms. The order is the
    # reverse of the accuracy order, and it sets the sweep speed: at 3 Hz the
    # camera may travel only 0.075 m/s to stay inside a 25 mm match radius.
    model: flowers_maskrcnn_sim
    instance_topic: /wrist_cam/left/instance_segmentation
    # This pipeline's own operating point; the offline perception uses 0.6.
    confidence_threshold: 0.8
    device: cuda
    sync_slop: 0.05
    erosion_radius_px: 2
    min_mask_pixels: 12
    # The simulator renders exact depth, so the median is safe here. On the real
    # rig this sits near p75 because foliage in front drags the median near.
    depth_percentile: 50.0
    max_depth_spread_m: 0.10
    min_depth_m: 0.15
    max_depth_m: 3.0
    # Mirrors the map node's match_radius_m so the node can warn when the arm
    # outruns the tracker.
    match_radius_m: 0.025

landmark_map_node:
  ros__parameters:
    use_sim_time: true
    tree_map_file: config/tree_map_sim.yaml
    # Rows sit 1.3 m apart in this scene, so half that keeps the catchments apart.
    tree_assignment_radius_m: 0.65
    # These two are bounded from both sides and must not be copied from the
    # drive-by pipeline, whose 0.06 m suits a camera advancing 0.2 m per frame.
    # Here the camera creeps, and flowers sit a median 30 mm apart (5th
    # percentile 16 mm) in this scene: a radius near the spacing fuses
    # neighbouring flowers into one landmark. 0.06 m cost 68% of the recall.
    match_radius_m: 0.025
    max_gap_frames: 2
    min_observations: 3
    # Merges a re-seen flower into the landmark it already has instead of adding
    # a second one; without it a sweep up and back counts every flower twice.
    # This is the sensitive one. It wants roughly 2.5 times the position noise:
    # below that one flower fragments into several landmarks, above it
    # neighbours fuse. Re-derive it once the noise is measured on a real run,
    # sigma = 8 mm here. The two bounds meet near sigma = 15 mm, and beyond
    # that individual flowers cannot be resolved at all, only corymbs.
    merge_radius_m: 0.020
    publish_interval_s: 1.0

scan_controller_node:
  ros__parameters:
    use_sim_time: true
    tree_map_file: config/tree_map_sim.yaml
    joint_command_topic: /isaac_joint_commands
    joint_state_topic: /isaac_joint_states
    base_frame: base_link
    map_frame: map
    tool_translation: [-0.16426, -0.00909, 0.05994]
    tool_rotation_xyzw: [0.5, 0.5, -0.5, 0.5]
    command_rate_hz: 30.0
    # Bounded by the frame rate in simulation time, which is what the tracker
    # runs on; the wall clock only decides how long a scan takes to watch.
    # The camera publishes 30.00 Hz of simulation time, but perception keeps up
    # with only about half of that, so the rate that matters is near 13 Hz. At
    # 0.15 m/s that measured 25 mm of travel per frame at the 95th percentile,
    # sitting exactly on the 25 mm match radius, and flowers fragmented: 67
    # landmarks for 51 real ones. Half the speed, half the travel.
    # MaskDINO costs 331 ms a frame, so perception sees far fewer frames than
    # the renderer produces and the sweep has to slow to match. The node reports
    # the travel it actually measures; raise this against that line.
    scan_speed_mps: 0.02
    path_step_m: 0.01
    column_spacing_m: 0.35
    settle_s: 2.0

gt_eval_node:
  ros__parameters:
    use_sim_time: true
    ground_truth_file: config/orchard_gt_sim.json
    match_radius_m: 0.10
    report_on_scan_end: true
    report_interval_s: 15.0
    # Scoring the band the arm can actually reach; AppleTree_01 grows to 4.31 m,
    # above the camera's 3.95 m ceiling, and those flowers are not misses.
    evaluate_z_min: 0.8
    evaluate_z_max: 3.9

dataset_capture_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /wrist_cam/left/image_raw
    instance_topic: /wrist_cam/left/instance_segmentation
    # Slivers of a flower behind a leaf carry no shape to learn and would be
    # scored as misses at test time.
    min_mask_pixels: 20
    min_instances: 1
    sync_slop: 0.05
    sync_queue_size: 20
    flush_every: 25
