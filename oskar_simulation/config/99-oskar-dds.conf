# Socket buffers for the Isaac camera streams. A 1280x720 depth frame is 3.7 MB
# and the default 1 MB ceiling drops it. Install with:
#     sudo cp 99-oskar-dds.conf /etc/sysctl.d/ && sudo sysctl --system
net.core.rmem_max = 67108864
net.core.rmem_default = 67108864
net.core.wmem_max = 67108864
net.core.wmem_default = 67108864
