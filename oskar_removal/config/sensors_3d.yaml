# MoveIt occupancy map from oskar_scene's filtered, target-carved views.
octomap_frame: world
octomap_resolution: 0.02
sensors:
  - oskar_scene_pointcloud
oskar_scene_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /scene/filtered_cloud
  max_range: 2.5
  point_subsample: 1
  padding_offset: 0.02
  padding_scale: 1.0
  max_update_rate: 0.0
  filtered_cloud_topic: /scene/moveit_self_filtered_cloud
