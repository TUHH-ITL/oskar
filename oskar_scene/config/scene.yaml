/**/local_scene_node:
  ros__parameters:
    planning_frame: base_link
    octomap_frame: world
    octomap_resolution: 0.02
    roi_size_xyz: [2.0, 2.0, 2.0]
    carve_margin: 0.02
    voxel_leaf_size: 0.01
    min_range: 0.30
    max_range: 2.50
    accumulate_views: 3
    clear_before_capture: true
    tf_timeout: 1.0
    scene_update_timeout: 5.0
    view_publish_interval: 0.10
